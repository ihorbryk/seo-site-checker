{{define "home"}}
<h1>Projects</h1>
<table>
<tr><th>Domain</th><th>Schedule</th><th>Pages</th></tr>
{{range .Projects}}<tr>
<td><b>{{.Domain}}</b></td><td>{{.Schedule}}</td><td>{{.ActivePages}} active</td>
</tr>{{end}}
</table>
{{template "newProject"}}
{{end}}

{{define "newProject"}}
<form hx-post="/projects" hx-target="#np" action="/projects" method="post" style="margin-top:16px;display:flex;gap:6px;align-items:center">
<input type="text" name="domain" placeholder="example.com — one exact host, https only" style="max-width:340px"><button class="btn primary">Add Project</button><span id="np"></span></form>
{{end}}

{{define "flash"}}<div class="flash{{if .Err}} err{{end}}">{{.Message}}</div>{{end}}
