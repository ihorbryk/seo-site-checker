{{define "head"}}
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · SEO Site Checker</title>
<script src="/static/htmx.min.js"></script>
<script>
// Validation errors come back as 422 with a flash fragment; let htmx show them.
document.addEventListener("htmx:beforeSwap", function (e) {
  if (e.detail.xhr.status === 422) { e.detail.shouldSwap = true; e.detail.isError = false; }
});
</script>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2330;background:#f6f7f9}
a{color:#2457c5;text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:22px 0 8px}h3{font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:#5b6475}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e6e8ec;vertical-align:top}
th{font-weight:600;font-size:12px;color:#5b6475;background:#fafbfc}
.muted{color:#7a8291}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;background:#e9ecf1;color:#3b4252;margin-right:3px;white-space:nowrap}
.btn{display:inline-block;border:1px solid #c9ced8;background:#fff;border-radius:6px;padding:5px 11px;font:inherit;cursor:pointer;color:#1d2330}
.btn.primary{background:#2457c5;border-color:#2457c5;color:#fff}.btn.danger{color:#b42318}
.flash{background:#dcf5e6;border:1px solid #9fdcb7;padding:6px 10px;border-radius:6px;margin:8px 0;white-space:pre-wrap}.flash.err{background:#fde2e1;border-color:#f3a9a4}
input[type=text],input[type=number],select,textarea{font:inherit;padding:5px 7px;border:1px solid #c9ced8;border-radius:5px;width:100%;max-width:520px;background:#fff}
.tabs{margin:0 0 12px;display:flex;gap:14px}.settings fieldset{background:#fff;border:1px solid #e6e8ec;border-radius:6px;margin:12px 0;padding:12px 16px}.settings label{display:block;margin:10px 0 4px;font-weight:600}.hdr{display:flex;gap:6px;margin-bottom:4px}.hdr .hname{max-width:200px}.hdr .hvalue{max-width:330px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fb36b;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.3}}
.pager{display:flex;gap:16px;align-items:center;margin:8px 0;flex-wrap:wrap}.pager .per a,.pager .per b{margin:0 2px}
.topbar{background:#1d2330;color:#fff;padding:10px 24px;display:flex;gap:20px;align-items:center}.topbar a{color:#fff}.topbar .brand{font-weight:700}.crumbs{color:#aab3c5}.crumbs a{color:#cfd8ea}.wrap{max-width:1180px;margin:20px auto;padding:0 24px 80px}
</style>
{{end}}

{{define "shell"}}<!doctype html><html lang="en"><head>{{template "head" .}}</head><body>
<header class="topbar"><a href="/" class="brand">SEO Site Checker</a>{{with .Crumbs}}<nav class="crumbs">{{range $i, $c := .}}{{if $i}} › {{end}}{{if $c.Href}}<a href="{{$c.Href}}">{{$c.Label}}</a>{{else}}{{$c.Label}}{{end}}{{end}}</nav>{{end}}</header>
<main class="wrap">{{.Content}}</main></body></html>
{{end}}
